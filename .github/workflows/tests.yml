name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Check documentation links
        run: python scripts/check_docs.py
      - run: python ppe.py test -q
      - run: python bytetrack_ppe/test_ablation_v1.py
      - name: Review API (empty checkout)
        run: python bytetrack_ppe/test_api.py --allow-empty
      - name: Job API (empty checkout)
        run: python bytetrack_ppe/test_job_api_v3.py --allow-empty
      - name: Human review (empty checkout)
        run: python bytetrack_ppe/test_human_review_v3.py
